name: Build Bonjour.nro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: devkitA64 build
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-g++ --version | head -1
          libnx_path="$DEVKITPRO/libnx/include/switch.h"
          test -f "$libnx_path" && echo "libnx: $libnx_path found"
          nacptool 2>&1 | head -1
          elf2nro 2>&1 | head -1

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify Bonjour.nro
        run: |
          set -eu
          test -f Bonjour.nro
          test -s Bonjour.nro

          size=$(stat -c '%s' Bonjour.nro)
          echo "Bonjour.nro: $size bytes"
          test "$size" -gt 100000

          # NRO header: "HOMEBREW" at 0x08, asset magic "NRO0" at 0x10.
          magic=$(dd if=Bonjour.nro bs=1 skip=8 count=8 status=none)
          echo "header magic: $magic"
          test "$magic" = "HOMEBREW"

          asset=$(dd if=Bonjour.nro bs=1 skip=16 count=4 status=none)
          echo "asset magic: $asset"
          test "$asset" = "NRO0"

          # The application title must be baked into the embedded NACP.
          strings Bonjour.nro | grep -q 'Bonjour!' || {
            echo "title missing from NACP"; exit 1; }

          test -f Bonjour.nacp
          echo "NRO verified."

      - name: Upload Bonjour.nro
        uses: actions/upload-artifact@v4
        with:
          name: Bonjour-nro
          path: Bonjour.nro
          if-no-files-found: error
          retention-days: 90
